server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy for API calls to the backend within the Docker network
    location /api/ {
        proxy_pass http://backend-webserver/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any path other than a real file, index.html works
    # (necessary for react-router-dom with routes like /service to work on reload)
    location / {
        try_files $uri /index.html;
    }

    # Aggressive caching for assets with hashes in their names (those generated by Vite in /assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
