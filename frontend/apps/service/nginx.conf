server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy de las llamadas a la API hacia el backend dentro de la red de Docker
    location /api/ {
        proxy_pass http://backend-webserver/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: cualquier ruta que no sea un fichero real, sirve index.html
    # (necesario para que react-router-dom con rutas como /service funcione al recargar)
    location / {
        try_files $uri /index.html;
    }

    # Cache agresiva para assets con hash en el nombre (los que genera Vite en /assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
