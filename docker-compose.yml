services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: vending
      APP_ENV: prod
    depends_on:
      - mongo

  backend-webserver:
    image: nginx:alpine
    volumes:
      - ./backend:/app
      - ./docker/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  frontend-machine:
    build: ./frontend/apps/machine
    ports:
      - "5173:80"
    depends_on:
      - backend-webserver

  frontend-service:
    build: ./frontend/apps/service
    ports:
      - "5174:80"
    depends_on:
      - backend-webserver

volumes:
  mongo_data:
