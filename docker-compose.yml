services:
  mongo:
    image: mongo:7
    container_name: vending-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: vending-backend
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: vending
      APP_ENV: prod
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "php bin/console app:seed-machine && php-fpm"]

  backend-webserver:
    image: nginx:alpine
    container_name: vending-backend-webserver
    volumes:
      - ./backend:/app
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

  frontend-machine:
    build:
      context: ./frontend
      dockerfile: apps/machine/Dockerfile
    container_name: vending-frontend-machine
    ports:
      - "5173:80"
    depends_on:
      - backend-webserver

  frontend-service:
    build:
      context: ./frontend
      dockerfile: apps/service/Dockerfile
    container_name: vending-frontend-service
    ports:
      - "5174:80"
    depends_on:
      - backend-webserver

volumes:
  mongo_data:
